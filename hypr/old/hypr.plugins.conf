plugin {

hyprglass {
    preset = name:blurry, blur_strength:0.4, blur_iterations:3, vibrancy:0.1696, refraction_strength:1.5, lens_distortion:1
    default_theme = dark       # or light
    default_preset = glass # or subtle, clear, glass, high_contrast
    layers {
    enabled = 1
    namespaces = waybar, dock
    namespace_presets = waybar:glass
  }
}
}
