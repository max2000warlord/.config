source = ~/.config/hypr/hypr.autostart.conf
source = ~/.config/hypr/keybinds.hyprland.conf
source = ~/.config/hypr/hypr.colors.conf
source = ~/.config/hypr/hypr.plugins.conf
source = ~/.cache/wal/colors-hyprland.conf
# source = ~/.config/hypr/hyprlock.conf

################
### MONITORS ###
################
# See https://wiki.hyprland.org/Configuring/Monitors/
 monitorv2 {
    output = DP-2
    mode = 3840x2160@144
    position = 0x0
    scale = 1.5
    bitdepth = 10
  # cm = hdredid
  # supports_wide_color = false
  # supports_hdr = true
  # sdrbrightness = 0.85
  # sdrsaturation = 0.9
  # sdr_min_luminance = 0.005
  # sdr_max_luminance = 120
}

monitorv2 {
    output = HDMI-A-3
    mode = preferred
    position = auto-left
    cm = auto
    scale = 1
}

monitorv2 {
  output = HDMI-A-2
  mode = 3840x2160@60
  position = auto-left
  scale = 1.5
  supports_wide_color = 1
  disabled = true
}

xwayland {
  force_zero_scaling = true
}


##################
### WORKSPACES ###
##################
workspace = 1,  monitor:DP-2
workspace = 2,  monitor:HDMI-A-2
workspace = 3,  monitor:DP-2
workspace = 4,  monitor:DP-2
workspace = 5,  monitor:DP-2
workspace = 6,  monitor:DP-2
workspace = 7,  monitor:DP-2
workspace = 8,  monitor:DP-2
workspace = 9,  monitor:DP-2
workspace = 10, monitor:HDMI-A-3

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = HYPRCURSOR_THEME,Sweet-cursors-hyprcursor
env = HYPRCURSOR_SIZE,30
env = XCURSOR_THEME,Sweet-cursors
env = XCURSOR_SIZE,30
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME_QT6,qt6ct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = DXVK_HDR,1
env = WAYLAND_DEBUG,0
env = PROTON_ENABLE_WAYLAND,1
env = PROTON_ENABLE_HDR,1
env = HYPRSHOT_DIR, /home/$USER/Pictures/Screenshots
#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 5
    
    border_size = 3

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffff) rgba(00ff99ff) 45deg
    col.inactive_border = rgba(595959ff)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

#xwayland {
#  force_zero_scaling = true
#}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 15

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 3
        vibrancy = 0.1696
    }

# layerrule = blur on, match:namespace ghostty
layerrule = blur on, match:namespace neovide
# layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace rofi

}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = md3_decel, 0.3, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
#   animation = hyprfocusIn, 1, 1.7, md3_decel
#   animation = hyprfocusOut, 1, 1.7, md3_accel
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
  #pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    scroll_method = on_button_down
    scroll_button = 274
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
windowrule = float on, size (monitor_w*0.3) (monitor_h*0.4), center on, match:title (1Password)
windowrule = float on, size (monitor_w*0.4) (monitor_h*0.4), match:class ^(blueman-manager)
windowrule = float on, match:class ^(waypaper)
windowrule = size (monitor_w*0.5) (monitor_h*0.5), match:title (waypaper)
 
windowrule = float on, match:title (KDE Connect)
windowrule = float on, match:class ^(xfce-polkit)
windowrule = float on, match:class ^(nwg-look)
windowrule = float on, match:class ^(sddm-conf)
windowrule = float on, match:class ^(swayimg)
windowrule = float on, match:class ^(solaar)
windowrule = float on, size (monitor_w*0.3) (monitor_h*0.3), match:class ^(org.pulseaudio.pavucontrol)
windowrule = float on, match:title (Calculator)
windowrule = float on, match:title (Export Image as (JPEG|PNG))
windowrule = float on, match:title (Choose Avatar Image)
windowrule = float on, match:title (File Operation Progress)
windowrule = float on, match:title (Steam Settings)
windowrule = float on, match:class ^(steam)$, match:title negative:^Steam$
windowrule = center on, size (monitor_w*0.2) (monitor_h*0.3), match:class (blueman-manager)
windowrule = suppress_event maximize, match:class .* # You'll probably like this.
 
windowrule = float on, center on, match:title (jetbrains-toolbox)
windowrule = border_size 0, match:class ^(com.mitchellh.ghostty)$
windowrule = border_size 0, match:class ^(neovide)$
windowrule = border_size 0, match:class ^(steam)$
windowrule = border_size 0, match:title ^(GLava)$

windowrule {
  name = hyprglass-ghostty
  tag = +hyprglass_preset_blurry
  match:class = ^(com.mitchellh.ghostty)$
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
#gestures {
#    workspace_swipe = false
#}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

cursor {
no_hardware_cursors = true
}


